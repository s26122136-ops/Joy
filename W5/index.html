        <button onclick="hostRevealCards()" class="w-full py-3 bg-terracotta-500 hover:bg-terracotta-600 text-white rounded-xl font-medium text-sm shadow-md shadow-terracotta-500/20 transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>

  <!-- Footer -->
  <footer class="border-t border-cream-200 py-4 text-center text-xs text-cream-800/60">
    雲端心電感應 Telepathy &copy; 2026 • 溫潤文青質感雙向同步互動
  </footer>

  <!-- JavaScript App Logic -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwjpS_8FQDxnWzvSenPkGnkPwVqlYyI5Y2mX3nLorQh36hXulfe66HDEnXJj1UjnoUa/exec";
    const POLLING_INTERVAL_MS = 2000;

    let currentRoom = "";
    let playerName = "";
    let isHost = false;
    let pollingTimer = null;
    let previousStatus = "";
    let previousAnswersHash = "";

    const mockStorage = {
      "default": { status: "setup", question: "", answers: {} }
    };

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'flip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'pop') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        }
      } catch (e) {}
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-sage-500 text-white' : 
                      type === 'warning' ? 'bg-warmgold-600 text-white' : 'bg-cream-900 text-cream-50';
      
      toast.className = `px-4 py-2.5 rounded-2xl shadow-xl font-medium text-xs flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 ${bgColor} pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function generateRandomRoom() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('input-room-id').value = randomCode;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('input-room-id').value = roomParam;
      }
    });

    function handleJoinGame(e) {
      e.preventDefault();
      playerName = document.getElementById('input-player-name').value.trim();
      currentRoom = document.getElementById('input-room-id').value.trim() || '8888';
      isHost = document.getElementById('input-is-host').checked;

      if (!playerName) {
        showToast('請輸入您的暱稱', 'warning');
        return;
      }

      document.getElementById('current-room-display').textContent = currentRoom;
      document.getElementById('room-badge').classList.remove('hidden');
      document.getElementById('room-badge').classList.add('flex');
      document.getElementById('player-name-display').textContent = playerName;
      document.getElementById('player-avatar').textContent = playerName.charAt(0).toUpperCase();

      const roleBadge = document.getElementById('role-badge');
      if (isHost) {
        roleBadge.textContent = "房主";
        roleBadge.className = "px-2 py-0.5 bg-terracotta-100 text-terracotta-600 text-[10px] rounded-md font-semibold";
      } else {
        roleBadge.textContent = "玩家";
        roleBadge.className = "px-2 py-0.5 bg-sage-100 text-sage-700 text-[10px] rounded-md font-semibold";
      }

      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('view-game').classList.remove('hidden');

      showToast(`已進入房間 #${currentRoom}`, 'success');

      fetchGameState();
      startPolling();
    }

    function leaveRoom() {
      stopPolling();
      currentRoom = "";
      document.getElementById('room-badge').classList.add('hidden');
      document.getElementById('view-game').classList.add('hidden');
      document.getElementById('view-lobby').classList.remove('hidden');
      showToast('已離開房間');
    }

    async function fetchGameState() {
      if (!currentRoom) return;

      const spinner = document.getElementById('polling-spinner');
      if (spinner) spinner.classList.remove('hidden');

      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`, {
          method: 'GET',
          cache: 'no-cache'
        });
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        updateGameUI(data);
      } catch (error) {
        if (!mockStorage[currentRoom]) {
          mockStorage[currentRoom] = { status: "setup", question: "", answers: {} };
        }
        updateGameUI(mockStorage[currentRoom]);
      } finally {
        if (spinner) spinner.classList.add('hidden');
      }
    }

    async function sendGameAction(payload) {
      payload.room = currentRoom;

      if (!mockStorage[currentRoom]) {
        mockStorage[currentRoom] = { status: "setup", question: "", answers: {} };
      }

      const roomData = mockStorage[currentRoom];
      if (payload.action === "reset") {
        roomData.status = "setup";
        roomData.question = "";
        roomData.answers = {};
      } else if (payload.action === "set_question") {
        roomData.status = "playing";
        roomData.question = payload.question;
        roomData.answers = {};
      } else if (payload.action === "submit_answer") {
        roomData.answers[payload.playerName] = payload.answer;
      } else if (payload.action === "reveal") {
        roomData.status = "revealed";
      }

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.log("GAS Post executed with local sync update fallback.");
      }

      fetchGameState();
    }

    function updateGameUI(data) {
      const { status, question, answers = {} } = data;

      if (status === 'revealed' && previousStatus !== 'revealed') {
        playSound('flip');
      }
      previousStatus = status;

      const statusLabel = document.getElementById('game-status-label');
      if (status === 'setup') statusLabel.textContent = '等待房主出題';
      else if (status === 'playing') statusLabel.textContent = '進行中 (填答階段)';
      else if (status === 'revealed') statusLabel.textContent = '開牌揭曉階段';

      const qDisplay = document.getElementById('question-display');
      qDisplay.textContent = question ? question : "等待房主出題中...";

      const playerList = Object.keys(answers);
      document.getElementById('answered-count').textContent = `${playerList.length} 人`;
      document.getElementById('cards-count-label').textContent = `共 ${playerList.length} 張卡牌`;

      const answerInputBox = document.getElementById('answer-input-box');
      if (status === 'playing') {
        answerInputBox.classList.remove('hidden');
        if (answers[playerName]) {
          document.getElementById('my-answer-status').classList.remove('hidden');
        } else {
          document.getElementById('my-answer-status').classList.add('hidden');
        }
      } else {
        answerInputBox.classList.add('hidden');
      }

      renderCards(answers, status);
    }

    function renderCards(answers, status) {
      const grid = document.getElementById('cards-grid');
      const entries = Object.entries(answers);
      
      const currentAnswersHash = JSON.stringify(answers) + status;
      if (currentAnswersHash === previousAnswersHash) return;
      previousAnswersHash = currentAnswersHash;

      if (entries.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center border-2 border-dashed border-cream-200 rounded-3xl text-cream-800/50">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            尚無卡牌，等待玩家填答...
          </div>
        `;
        return;
      }

      const answerCounts = {};
      entries.forEach(([_, ans]) => {
        const cleaned = ans.trim().toLowerCase();
        answerCounts[cleaned] = (answerCounts[cleaned] || 0) + 1;
      });

      grid.innerHTML = '';

      entries.forEach(([pName, answer]) => {
        const cleanedAns = answer.trim().toLowerCase();
        const isMatch = status === 'revealed' && answerCounts[cleanedAns] > 1;
        const isMe = pName === playerName;

        const cardElement = document.createElement('div');
        cardElement.className = 'perspective-1000 h-44 w-full';

        const isFlipped = status === 'revealed';

        cardElement.innerHTML = `
          <div class="card-inner w-full h-full relative transform-style-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}">
            
            <!-- FRONT OF CARD -->
            <div class="absolute inset-0 w-full h-full rounded-2xl p-4 bg-gradient-to-br from-cream-100 to-cream-200 border border-cream-300 shadow-md backface-hidden flex flex-col justify-between items-center text-center">
              <div class="w-full flex justify-between items-center">
                <span class="text-[10px] px-2 py-0.5 bg-white/70 rounded-full font-mono text-cream-800">${isMe ? '我' : '玩家'}</span>
                <span class="w-2 h-2 rounded-full ${answers[pName] ? 'bg-emerald-500' : 'bg-gray-300'}"></span>
              </div>

              <div>
                <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-white shadow-sm flex items-center justify-center font-serif text-lg font-bold text-terracotta-600">
                  ${pName.charAt(0).toUpperCase()}
                </div>
                <h4 class="font-serif font-bold text-sm text-cream-900">${pName}</h4>
              </div>

              <div class="text-[11px] text-cream-800/60 font-medium">
                ${status === 'playing' ? '✓ 已上繳卡牌 (等待開牌)' : '準備中...'}
              </div>
            </div>

            <!-- BACK OF CARD -->
            <div class="absolute inset-0 w-full h-full rounded-2xl p-5 border shadow-lg backface-hidden rotate-y-180 flex flex-col justify-between items-center text-center transition-all ${
              isMatch 
                ? 'bg-gradient-to-br from-terracotta-100 via-white to-amber-50 border-terracotta-500 ring-2 ring-terracotta-500/30' 
                : 'bg-white border-cream-200'
            }">
              <div class="w-full flex justify-between items-center">
                <span class="font-serif text-xs font-bold ${isMatch ? 'text-terracotta-600' : 'text-cream-800'}">${pName}</span>
                ${isMatch ? '<span class="px-2 py-0.5 bg-terracotta-500 text-white text-[10px] font-bold rounded-full shadow-sm animate-pulse">心電感應成功!</span>' : ''}
              </div>

              <div class="my-auto px-2">
                <div class="text-xs text-cream-800/60 mb-1">答案</div>
                <div class="font-serif text-xl font-bold text-cream-900 break-words line-clamp-2">${answer}</div>
              </div>

              <div class="text-[10px] text-cream-800/40">
                ${isMatch ? `與 ${answerCounts[cleanedAns] - 1} 人想法一致` : '獨一無二的想法'}
              </div>
            </div>

          </div>
        `;

        grid.appendChild(cardElement);
      });
    }

    function submitMyAnswer() {
      const ansInput = document.getElementById('my-answer-input');
      const val = ansInput.value.trim();
      if (!val) {
        showToast('請先輸入答案', 'warning');
        return;
      }

      sendGameAction({
        action: 'submit_answer',
        playerName: playerName,
        answer: val
      });

      playSound('pop');
      showToast('答案已成功送出！', 'success');
      document.getElementById('my-answer-status').classList.remove('hidden');
    }

    function startPolling() {
      stopPolling();
      pollingTimer = setInterval(fetchGameState, POLLING_INTERVAL_MS);
    }

    function stopPolling() {
      if (pollingTimer) clearInterval(pollingTimer);
    }

    function toggleHostConsoleModal() {
      if (!currentRoom) {
        showToast('請先進入房間再開啟主控台', 'warning');
        return;
      }
      const modal = document.getElementById('host-modal');
      modal.classList.toggle('hidden');
    }

    function usePresetQuestion(qText) {
      document.getElementById('host-question-input').value = qText;
    }

    function hostSetQuestion() {
      const qInput = document.getElementById('host-question-input');
      const qText = qInput.value.trim();
      if (!qText) {
        showToast('請輸入題目內容', 'warning');
        return;
      }
      sendGameAction({
        action: 'set_question',
        question: qText
      });
      document.getElementById('my-answer-input').value = '';
      toggleHostConsoleModal();
      showToast('已發布新題目！', 'success');
    }

    function hostRevealCards() {
      sendGameAction({
        action: 'reveal'
      });
      toggleHostConsoleModal();
      showToast('全網頁同步開牌中...', 'success');
    }

    function hostResetGame() {
      sendGameAction({
        action: 'reset'
      });
      document.getElementById('host-question-input').value = '';
      document.getElementById('my-answer-input').value = '';
      toggleHostConsoleModal();
      showToast('房間狀態已重置');
    }
  </script>
</body>
</html>
