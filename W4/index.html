<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瘋狂朋友吐槽留言牆 🤪</title>
  <style>
    /* =========================================================
       1. 全域變數設定 (搞笑風/新粗獷主義配色 Zone)
       ========================================================= */
    :root {
      /* 【顏色設定 Zone】爆笑鮮豔配色，可自行替換 Hex Code */
      --bg-color: #ffde59;          /* 主背景色：亮黃色 (搶眼迷因風) */
      --card-bg: #ffffff;          /* 卡片背景：純白 */
      --card-border: #000000;      /* 卡片邊框：經典粗黑邊框 */
      
      --text-main: #000000;         /* 主要文字：黑色 */
      --text-muted: #666666;        /* 次要/時間文字：灰色 */
      --accent-color: #ff3366;      /* 搞笑重點色：爆笑桃紅 */
      
      /* 輪播高亮時的彩虹霓虹與發光 (Highlight Style) */
      --highlight-bg: #ccff00;      /* 高亮卡片背景：螢光綠 */
      --highlight-shadow: 8px 8px 0px #000000; /* 經典漫畫實心陰影 */
      
      /* 【輪播秒數設定 Zone】(單位：毫秒) */
      --carousel-time: 3000ms;
    }

    /* 基本樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Impact", "Arial Black", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 點點背景圖案 (Pop-Art Polka Dots) */
      background-image: radial-gradient(#000000 15%, transparent 16%);
      background-size: 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      background: #ffffff;
      padding: 1.5rem 2rem;
      border: 4px solid #000000;
      box-shadow: 6px 6px 0px #000000;
      transform: rotate(-1.5deg);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 2px 2px 0px #000;
      letter-spacing: 2px;
    }

    header p {
      color: var(--text-main);
      font-size: 1rem;
      font-weight: bold;
      margin-top: 0.5rem;
    }

    /* =========================================================
       2. 爆笑載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
      background: #ffffff;
      padding: 2rem;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
    }

    .funny-spinner {
      font-size: 3.5rem;
      animation: crazy-spin 0.6s infinite linear, bounce 0.5s infinite alternate;
    }

    #loading p {
      font-weight: bold;
      font-size: 1.3rem;
      color: #000;
      margin-top: 1rem;
    }

    @keyframes crazy-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes bounce {
      0% { translateY: 0px; }
      100% { translateY: -15px; }
    }

    /* =========================================================
       3. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-container {
      width: 100%;
      max-width: 1100px;
      /* CSS Columns 實作瀑布流 */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 預設隱藏，待資料載入後顯示 */
    }

    /* 響應式斷點：手機與平板視窗調整欄數 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* =========================================================
       4. 搞笑對話框卡片樣式與焦點動畫
       ========================================================= */
    .card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 15px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片在瀑布流中被截斷 */
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      box-shadow: 5px 5px 0
