<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悄悄話留言板</title>
  <style>
    /* =========================================================
       1. 全域變數設定 (方便後續快速修改顏色與樣式)
       ========================================================= */
    :root {
      /* 【顏色設定 Zone】可在此替換您喜歡的主題色彩 */
      --bg-color: #0b0c10;          /* 主背景色：深邃暗夜黑 */
      --card-bg: rgba(255, 255, 255, 0.05); /* 卡片背景：半透明玻璃質感 */
      --card-border: rgba(255, 255, 255, 0.1); /* 卡片預設邊框 */
      
      --text-main: #e0e6ed;         /* 主要文字顏色 */
      --text-muted: #8a99ad;        /* 次要/時間文字顏色 */
      --accent-color: #a78bfa;      /* 浪漫神秘紫 (名字與亮點色) */
      
      /* 輪播高亮時的發光顏色 (Neon Glow) */
      --highlight-glow: rgba(167, 139, 250, 0.6); 
      --highlight-border: #c4b5fd;
    }

    /* 基本樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle at 50% 10%, #1f1a3a 0%, var(--bg-color) 70%);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* =========================================================
       2. 酷炫載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
      gap: 1rem;
    }

    .whisper-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(167, 139, 250, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s infinite linear, pulse 2s infinite ease-in-out;
    }

    #loading p {
      letter-spacing: 2px;
      color: var(--accent-color);
      font-size: 1.1rem;
      animation: blink 1.5s infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-container {
      width: 100%;
      max-width: 1200px;
      /* CSS Columns 實作瀑布流 */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 預設隱藏，待資料載入後顯示 */
    }

    /* 響應式斷點：手機與平板視窗調整欄數 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* =========================================================
       4. 留言卡片樣式與焦點動畫
       ========================================================= */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px); /* 輕微毛玻璃效果 */
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片在瀑布流中被截斷 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    .card-author {
      font-weight: 600;
      color: var(--accent-color);
      font-size: 1.05rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-content {
      line-height: 1.6;
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: pre-wrap; /* 保留留言中的換行符號 */
      word-break: break-word;
    }

    /* ---【重點效果】輪播高亮 (Highlight) 狀態 --- */
    .card.is-highlighted {
      transform: scale(1.05); /* 放大卡片 */
      border-color: var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-glow); /* 霓虹發光 */
      background: rgba(255, 255, 255, 0.12);
      z-index: 10;
    }

    /* ---【重點效果】未被選中 (Dimmed) 狀態 --- */
    .masonry-container.has-active .card:not(.is-highlighted) {
      opacity: 0.35;        /* 變暗 */
      filter: blur(1.5px);   /* 輕微模糊 */
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>🤫 悄悄話留言牆</h1>
    <p>夜深人靜時，聽聽大家留給我的秘密訊息...</p>
  </header>

  <!-- 載入中動畫 -->
  <div id="loading">
    <div class="whisper-spinner"></div>
    <p>讀取悄悄話中...</p>
  </div>

  <!-- 瀑布流卡片牆 -->
  <div id="masonry-wall" class="masonry-container"></div>

  <script>
    /* =========================================================
       5. JavaScript 邏輯控制區
       ========================================================= */

    // 【參數設定 Zone】
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzQ9hxlz17-FjU9oXi-Qn-yKLyeRWVxbOGNXeZQhU3YX3LpUmH_ITjQKOLgyALuj-OQgpvoEEKJd7-/pub?output=csv';
    const ROTATE_INTERVAL = 3000; // 【輪播秒數】目前設定為 3000 毫秒 (3秒)

    let cardsData = [];
    let currentIndex = -1;
    let carouselTimer = null;

    // DOM 元素 DOM 節點引用
    const loadingEl = document.getElementById('loading');
    const wallEl = document.getElementById('masonry-wall');

    // 頁面載入完成後發動
    window.addEventListener('DOMContentLoaded', init);

    async function init() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        cardsData = parseCSV(csvText);

        // 隱藏 Loading，顯示留言牆
        loadingEl.style.display = 'none';
        wallEl.style.display = 'block';

        // 渲染卡片
        renderCards(cardsData);

        // 開始自動輪播高亮特效
        if (cardsData.length > 0) {
          wallEl.classList.add('has-active'); // 啟用未選中卡片變暗的機制
          startCarousel();
        }
      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = '<p style="color:#ef4444;">無法載入留言，請檢查網路或網址連結。</p>';
      }
    }

    /**
     * 【專業 CSV 解析器】
     * 自動處理留言內容中含有「逗號」、「雙引號」與「換行」的情況
     */
    function parseCSV(text) {
      const lines = text.trim().split(/\r\n|\n/);
      const result = [];

      // 從第 1 行開始 (跳過第 0 行欄位標題)
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;

        // 正則表達式匹配 CSV 格式
        const row = [];
        let insideQuotes = false;
        let entry = '';

        for (let char of lines[i]) {
          if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim().replace(/^"|"$/g, '')); // 清除邊界引號
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));

        // 欄位預設順序：[0]時間戳記, [1]名字, [2]悄悄話
        if (row.length >= 3) {
          result.push({
            timestamp: row[0],
            name: row[1] || '無名氏',
            message: row[2] || ''
          });
        }
      }
      return result;
    }

    /**
     * 動態產生卡片 DOM 元素並插入牆面
     */
    function renderCards(data) {
      wallEl.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;

        // 格式化時間 (可選處理)
        const formattedTime = item.timestamp ? item.timestamp.split(' ')[0] : '';

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
        `;

        // 支援手動點擊切換高亮焦點
        card.addEventListener('click', () => {
          currentIndex = index;
          updateHighlight();
          resetCarousel(); // 點擊後重新計算 3 秒計時
        });

        wallEl.appendChild(card);
      });
    }

    /**
     * 啟動輪播計時器 (setInterval)
     */
    function startCarousel() {
      // 先立即執行一次
      currentIndex = 0;
      updateHighlight();

      // 每隔 3 秒進行下一張高亮切換
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateHighlight();
      }, ROTATE_INTERVAL);
    }

    /**
     * 更新當前高亮的卡片樣式
     */
    function updateHighlight() {
      const cards = wallEl.querySelectorAll('.card');
      cards.forEach((card, idx) => {
        if (idx === currentIndex) {
          card.classList.add('is-highlighted');
          // 可選：自動將高亮卡片微調捲動至視野 central (若需要可啟用)
          // card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('is-highlighted');
        }
      });
    }

    /**
     * 重置輪播計時器 (使用者手動點擊時觸發)
     */
    function resetCarousel() {
      clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateHighlight();
      }, ROTATE_INTERVAL);
    }

    /**
     * 簡易 XSS 防護處理
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
