<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瘋狂朋友吐槽留言牆 🤪</title>
  <style>
    /* =========================================================
       1. 全域變數設定 (搞笑風/新粗獷主義配色 Zone)
       ========================================================= */
    :root {
      /* 【顏色設定 Zone】爆笑鮮豔配色，可自行替換 Hex Code */
      --bg-color: #ffde59;          /* 主背景色：亮黃色 (搶眼迷因風) */
      --card-bg: #ffffff;          /* 卡片背景：純白 */
      --card-border: #000000;      /* 卡片邊框：經典粗黑邊框 */
      
      --text-main: #000000;         /* 主要文字：黑色 */
      --text-muted: #666666;        /* 次要/時間文字：灰色 */
      --accent-color: #ff3366;      /* 搞笑重點色：爆笑桃紅 */
      
      /* 輪播高亮時的彩虹霓虹與發光 (Highlight Style) */
      --highlight-bg: #ccff00;      /* 高亮卡片背景：螢光綠 */
      --highlight-shadow: 8px 8px 0px #000000; /* 經典漫畫實心陰影 */
      
      /* 【輪播秒數設定 Zone】(單位：毫秒) */
      --carousel-time: 3000ms;
    }

    /* 基本樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Impact", "Arial Black", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 點點背景圖案 (Pop-Art Polka Dots) */
      background-image: radial-gradient(#000000 15%, transparent 16%);
      background-size: 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      background: #ffffff;
      padding: 1.5rem 2rem;
      border: 4px solid #000000;
      box-shadow: 6px 6px 0px #000000;
      transform: rotate(-1.5deg);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 2px 2px 0px #000;
      letter-spacing: 2px;
    }

    header p {
      color: var(--text-main);
      font-size: 1rem;
      font-weight: bold;
      margin-top: 0.5rem;
    }

    /* =========================================================
       2. 爆笑載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
      background: #ffffff;
      padding: 2rem;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
    }

    .funny-spinner {
      font-size: 3.5rem;
      animation: crazy-spin 0.6s infinite linear, bounce 0.5s infinite alternate;
    }

    #loading p {
      font-weight: bold;
      font-size: 1.3rem;
      color: #000;
      margin-top: 1rem;
    }

    @keyframes crazy-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes bounce {
      0% { translateY: 0px; }
      100% { translateY: -15px; }
    }

    /* =========================================================
       3. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-container {
      width: 100%;
      max-width: 1100px;
      /* CSS Columns 實作瀑布流 */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 預設隱藏，待資料載入後顯示 */
    }

    /* 響應式斷點：手機與平板視窗調整欄數 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* =========================================================
       4. 搞笑對話框卡片樣式與焦點動畫
       ========================================================= */
    .card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 15px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片在瀑布流中被截斷 */
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      box-shadow: 5px 5px 0px #000000;
      cursor: pointer;
    }

    /* 亂數歪斜效果 (讓卡片看起來像隨手貼上去的貼紙) */
    .card:nth-child(even) { transform: rotate(1.5deg); }
    .card:nth-child(odd) { transform: rotate(-1.5deg); }
    .card:nth-child(3n) { transform: rotate(2.5deg); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      border-bottom: 3px dashed #000;
      padding-bottom: 0.4rem;
    }

    .card-author {
      font-weight: 900;
      color: #000;
      font-size: 1.1rem;
      background: #ff99c8;
      padding: 2px 8px;
      border: 2px solid #000;
      border-radius: 6px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .card-content {
      line-height: 1.5;
      font-size: 1rem;
      color: var(--text-main);
      font-weight: bold;
      white-space: pre-wrap; /* 保留換行符號 */
      word-break: break-word;
      position: relative;
    }

    /* 卡片右下角隨機爆笑 Emoji 裝飾 */
    .card-emoji {
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 1.8rem;
      filter: drop-shadow(2px 2px 0px #000);
    }

    /* ---【重點特效】輪播高亮 (Highlight) 狀態 --- */
    .card.is-highlighted {
      transform: scale(1.12) rotate(0deg) !important; /* 放大並擺正 */
      background-color: var(--highlight-bg) !important;
      border-color: #000 !important;
      box-shadow: var(--highlight-shadow) !important;
      z-index: 100;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: scale(1.12) rotate(0deg); }
      20% { transform: scale(1.12) rotate(-3deg); }
      70% { transform: scale(1.12) rotate(3deg); }
    }

    /* ---【重點特效】未被選中 (Dimmed) 狀態 --- */
    .masonry-container.has-active .card:not(.is-highlighted) {
      opacity: 0.3;         /* 顯著變暗 */
      filter: blur(2px) grayscale(50%); /* 模糊加灰階 */
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <h1>🤡 爆笑朋友吐槽牆 🤡</h1>
    <p>以下開放各路好友公開處刑與黑歷史爆料...</p>
  </header>

  <!-- 爆笑載入中動畫 -->
  <div id="loading">
    <div class="funny-spinner">🤪</div>
    <p>正在瘋狂挖取黑歷史留言中...</p>
  </div>

  <!-- 瀑布流卡片牆 -->
  <div id="masonry-wall" class="masonry-container"></div>

  <script>
    /* =========================================================
       5. JavaScript 邏輯控制區
       ========================================================= */

    // 【參數設定 Zone】
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQdx4dBDn07VbBtPHQF-AxpoHTDjW51TUAkIWwXtLPVbvYthm9Ado0kgSiJeUGczRW7J7VrV5fSsYGr/pub?output=csv';
    
    // 【輪播秒數控制】控制卡片高亮切換的時間隔 (3000 = 3 秒)
    const ROTATE_INTERVAL = 3000;

    // 搞笑隨機表情符號包
    const FUNNY_EMOJIS = ['💩', '🤡', '👻', '🙈', '🔥', '🤣', '🥑', '🗿', '💣', '👀'];

    let cardsData = [];
    let currentIndex = -1;
    let carouselTimer = null;

    // DOM 節點引用
    const loadingEl = document.getElementById('loading');
    const wallEl = document.getElementById('masonry-wall');

    // 頁面載入完成後啟動
    window.addEventListener('DOMContentLoaded', init);

    async function init() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        cardsData = parseCSV(csvText);

        // 隱藏 Loading，顯示留言牆
        loadingEl.style.display = 'none';
        wallEl.style.display = 'block';

        // 渲染卡片
        renderCards(cardsData);

        // 開始自動輪播高亮特效
        if (cardsData.length > 0) {
          wallEl.classList.add('has-active'); // 啟用未選中卡片變暗 blur 效果
          startCarousel();
        }
      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = '<p style="color:#ff0000; font-size:1.5rem;">💩 完蛋！留言讀取失敗了！</p>';
      }
    }

    /**
     * 【強健的 CSV 解析器】
     * 能夠正確處理留言內包含半角逗號 (,) 或換行符號的情況
     */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            entry += '"';
            i++; // 跳過雙重引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\n' || char === '\r') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 \r\n
          }
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') {
            result.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }

      if (entry || row.length > 0) {
        row.push(entry.trim());
        result.push(row);
      }

      // 跳過第 0 行欄位標題 (時間戳記, 名字, 悄悄話)
      return result.slice(1).map(r => ({
        timestamp: r[0] || '',
        name: r[1] || '匿名怪客',
        message: r[2] || '這傢伙什麼都沒留下...'
      }));
    }

    /**
     * 動態生成搞笑卡片並渲染至畫面
     */
    function renderCards(data) {
      wallEl.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;

        // 格式化時間 (只取日期部分)
        const formattedTime = item.timestamp ? item.timestamp.split(' ')[0] : '剛剛';
        
        // 隨機選擇一個搞笑 Emoji
        const randomEmoji = FUNNY_EMOJIS[Math.floor(Math.random() * FUNNY_EMOJIS.length)];

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">👤 ${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
          <div class="card-emoji">${randomEmoji}</div>
        `;

        // 手動點擊卡片切換焦點
        card.addEventListener('click', () => {
          currentIndex = index;
          updateHighlight();
          resetCarousel(); // 重新計算 3 秒計時器
        });

        wallEl.appendChild(card);
      });
    }

    /**
     * 設定 setInterval 計時器開始輪播
     */
    function startCarousel() {
      currentIndex = 0;
      updateHighlight();

      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateHighlight();
      }, ROTATE_INTERVAL);
    }

    /**
     * 更新目前高亮卡片 (套用 is-highlighted Class)
     */
    function updateHighlight() {
      const cards = wallEl.querySelectorAll('.card');
      cards.forEach((card, idx) => {
        if (idx === currentIndex) {
          card.classList.add('is-highlighted');
        } else {
          card.classList.remove('is-highlighted');
        }
      });
    }

    /**
     * 當使用者點擊卡片時重置 3 秒計時器
     */
    function resetCarousel() {
      clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateHighlight();
      }, ROTATE_INTERVAL);
    }

    /**
     * XSS 防護
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
